services:
  - type: web
    name: ekt-ia-systems
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn web_app:app --host 0.0.0.0 --port $PORT
    autoDeploy: true
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.13
      - key: EKT_DATA_DIR
        value: data
      - key: DATABASE_URL
        sync: false
      - key: INVESTMENTS_USER
        sync: false
      - key: INVESTMENTS_PASSWORD
        sync: false
      - key: BUDGET_SESSION_SECRET
        sync: false
      - key: B3_FLOW_START_DATE
        value: 2026-04-01
      - key: B3_FLOW_TIMEZONE
        value: America/Sao_Paulo
  - type: cron
    name: ekt-b3-investor-flow
    runtime: python
    schedule: "30 1,10,13,23 * * 1-6"
    buildCommand: pip install -r requirements.txt
    startCommand: python -m jobs.b3_flow_collect --start 2026-04-01
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.13
      - key: DATABASE_URL
        sync: false
      - key: B3_FLOW_START_DATE
        value: 2026-04-01
      - key: B3_FLOW_TIMEZONE
        value: America/Sao_Paulo
