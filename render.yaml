services:
  - type: web
    name: ekt-ia-systems
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn web_app:app --host 0.0.0.0 --port $PORT
    autoDeploy: true
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.13
      - key: EKT_DATA_DIR
        value: data
      - key: DATABASE_URL
        fromDatabase:
          name: ekt-ia-systems-db
          property: connectionString
      - key: INVESTMENTS_USER
        sync: false
      - key: INVESTMENTS_PASSWORD
        sync: false

databases:
  - name: ekt-ia-systems-db
    plan: free
