name: ekt_ia_flutter_frontend
description: Flutter frontend shell for EKT IA Systems.
publish_to: "none"
version: 0.2.2+5

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.2.2
  intl: ^0.20.2
  flutter_svg: ^2.0.17
  web: ^1.1.1
  pdf: ^3.11.3
  printing: ^5.14.2
  fl_chart: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/budget_3d.png
    - assets/images/ibovespa_market_3d.png
    - assets/images/win_futures_3d.png
    - assets/images/jex_logo.png
    - assets/images/market_symbols/
    - nosso_repositorio/logos/
